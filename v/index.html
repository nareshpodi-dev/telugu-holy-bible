<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<title>పరిశుద్ధ గ్రంథము · Telugu Bible</title>
<meta name="description" content="A verse from the Telugu Bible (పరిశుద్ధ గ్రంథము) with the English KJV. Read it in the free, offline Telugu Bible app.">
<style>
.verse{font-size:1.35rem;line-height:1.9}
.verse sup{color:var(--gold);font-weight:700;font-size:.7em;margin-right:4px}
.en{color:var(--muted);font-style:italic;margin-top:14px;line-height:1.6}
.ref{color:var(--gold);font-weight:700;font-size:1.2rem;margin:0 0 10px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:24px 0 8px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--gold)}
.hidden{display:none}
header{padding:20px 16px 18px}
header img{width:56px;height:56px;border-radius:14px}
header h1{font-size:1.4rem;margin:8px 0 0}
main{padding-top:20px}
</style>
</head>
<body>
<header><img src="../icon.png" alt=""><h1>పరిశుద్ధ గ్రంథము</h1><p>Holy Bible in Telugu</p></header>
<main>
  <div class="card">
    <p class="ref" id="ref">…</p>
    <div class="verse" id="te"></div>
    <div class="en" id="en"></div>
    <p id="error" class="hidden">ఈ వచనం దొరకలేదు. (This verse could not be found.)</p>
  </div>
  <div class="actions">
    <a class="btn" id="open" href="#">యాప్‌లో తెరవండి · Open in the app</a>
  </div>
  <div class="actions">
    <a class="btn alt" id="play" href="#">Google Play</a>
    <a class="btn alt" id="appstore" href="#">App Store</a>
  </div>
  <p style="text-align:center;color:var(--muted)">ఉచితం, ప్రకటనలు లేవు, ఇంటర్నెట్ లేకుండానే పనిచేస్తుంది · Free, no ads, works offline</p>
</main>
<footer><a href="../">పరిశుద్ధ గ్రంథము</a> · <a href="../privacy.html">Privacy</a></footer>
<script>
// Links look like  v/?r=43.3.16  or  v/?r=43.3.16-18  (book.chapter.verse[-verse])
const PLAY = 'https://play.google.com/store/apps/details?id=com.nareshpodi.holy_bible';
const APP_STORE = 'https://apps.apple.com/app/id6835172635';

document.getElementById('play').href = PLAY;
document.getElementById('appstore').href = APP_STORE;

function fail() {
  document.getElementById('error').classList.remove('hidden');
  document.getElementById('ref').textContent = '';
}

function cover(label, from, to) {
  const [a, b] = label.split('-').map(Number);
  const z = b || a;
  return z >= from && a <= to;
}

async function show() {
  const r = new URLSearchParams(location.search).get('r') || '';
  const m = r.match(/^(\d{1,2})\.(\d{1,3})\.(\d{1,3})(?:-(\d{1,3}))?$/);
  if (!m) return fail();
  const [book, chapter, from] = [+m[1], +m[2], +m[3]];
  const to = m[4] ? +m[4] : from;
  try {
    const [books, te, en] = await Promise.all([
      fetch('data/books.json').then(x => x.json()),
      fetch(`data/te/${book}/${chapter}.json`).then(x => x.json()),
      fetch(`data/en/${book}/${chapter}.json`).then(x => x.json()),
    ]);
    const meta = books.find(b => b[0] === book);
    const rows = te.filter(([label]) => cover(label, from, to));
    if (!meta || !rows.length) return fail();
    const span = to > from ? `${from}-${to}` : `${from}`;
    const ref = `${meta[1]} ${chapter}:${span}`;
    document.getElementById('ref').textContent = `${ref} · ${meta[2]} ${chapter}:${span}`;
    const box = document.getElementById('te');
    for (const [label, text] of rows) {
      const p = document.createElement('p');
      const sup = document.createElement('sup');
      sup.textContent = label;
      p.append(sup, document.createTextNode(text));
      box.append(p);
    }
    document.getElementById('en').textContent =
      en.slice(from - 1, to).join(' ') + ' (KJV)';
    document.title = `${ref} · పరిశుద్ధ గ్రంథము`;
    document.querySelector('meta[name=description]').content =
      `${ref} — ${rows.map(x => x[1]).join(' ').slice(0, 150)}`;
    document.getElementById('open').href =
      `holybible://v/${book}/${chapter}/${from}`;
  } catch (e) {
    fail();
  }
}
show();
</script>
</body>
</html>
